<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#212227">
  <meta name="description" content="Your kettlebell workout library and weekly plan.">
  <title>KB 2.0</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/hmkb-favicon-v2-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/hmkb-apple-touch-v2-180.png">
  <meta name="apple-mobile-web-app-title" content="HM/KB">
  <link rel="stylesheet" href="./styles/hm-tokens.css">
  <link rel="stylesheet" href="./styles/app.css">
  <link rel="stylesheet" href="./styles/hm-header.css">
  <link rel="stylesheet" href="./styles/hm-today.css">
  <link rel="stylesheet" href="./styles/hm-library.css">
  <link rel="stylesheet" href="./styles/hm-details.css">
  <link rel="stylesheet" href="./styles/hm-active.css">
  <link rel="stylesheet" href="./styles/hm-footer.css">
  <link rel="stylesheet" href="./styles/hm-progress.css">
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <header class="app-header">
    <a class="brand-lockup" href="#today" aria-label="Heavy Metal KB home">
      <img class="brand-logo" src="./assets/branding/hmkblogo001.png" width="1254" height="1254" alt="">
      <span class="brand-name">HEAVY METAL <span class="brand-initials">KB</span></span>
    </a>
    <div class="header-secondary">
      <span class="label">YOUR WORK. YOUR WEEK.</span>
      <div class="header-account"></div>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <p id="status" class="hm-footer-reserve" role="status" aria-live="polite"></p>
  <nav class="hm-bottom-nav" aria-label="Main navigation">
    <a href="#today">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <rect x="4" y="5" width="16" height="16" rx="2"/>
        <path d="M8 3v4m8-4v4M4 11h16M8 15h.01M12 15h.01M16 15h.01M8 18h.01M12 18h.01"/>
      </svg>
      <span>Today</span>
    </a>
    <a href="#library">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <rect x="4" y="7" width="4" height="10" rx="1"/>
        <rect x="16" y="7" width="4" height="10" rx="1"/>
        <path d="M8 10h8M8 14h8M4 10H2v4h2m16-4h2v4h-2"/>
      </svg>
      <span>Library</span>
    </a>
    <a href="#progress">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <rect x="4" y="12" width="3" height="8" rx=".5"/>
        <rect x="10.5" y="5" width="3" height="15" rx=".5"/>
        <rect x="17" y="9" width="3" height="11" rx=".5"/>
      </svg>
      <span>Progress</span>
    </a>
    <a href="#history">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M3 4v5h5M3.5 8a8.5 8.5 0 1 1-.5 6M12 8v5l3 2"/>
      </svg>
      <span>History</span>
    </a>
  </nav>
</body>
</html>
